# All fields are optional; commented values show the defaults.

# Directory for disposable data: binary cache and sockets.
#cache_dir: ~/.cache/cld
# Directory for data that must not be lost: conversation backups and your
# user-default Claude Code config (see auth.share_config below).
#data_dir: ~/.local/share/cld

# Glob patterns matched against the host-side workspace path
# (the "devcontainer.local_folder" label) to exclude from provisioning.
# "**" crosses path separators; a leading "~/" expands to the home directory.
#ignore:
#  - ~/work/vendor/**

# What a claude session runs with. These apply to the processes cld starts —
# the claude session, the panes you split off it, and the scripts below — not to
# the container as a whole (cld does not create it; put container-wide values in
# devcontainer.json). Full reference: docs/session-env.md.
#
# Environment variables for every managed container. Values may extend what is
# already there (${PATH}:/x), defer to it (${FOO:-default}), read the DAEMON's
# own environment for secrets you don't want in this file (${env:NAME}), or
# remove a variable the image set (null). Your value wins over devcontainer.json;
# the variables cld manages itself (CLAUDE_CONFIG_DIR, SSH_AUTH_SOCK,
# ANTHROPIC_*, OTEL_*, ...) are rejected here rather than silently ignored.
#env:
#  EDITOR: vim
#  PATH: ${PATH}:/opt/mytools/bin

# Host files to place in every container, for what an environment variable
# cannot carry — TLS material, a credential file. "src" must be under your home
# and written as "~/..." (the daemon reads your host through a read-only mount
# of it); "dst" may use ${HOME} and ${CLD_WORKSPACE}. Copied owned by the
# container user at mode 0600 unless you say otherwise, and re-copied when the
# source changes.
#files:
#  # cld injects the `gh` binary into containers whose workspace has a GitHub
#  # remote, but it lands logged out; hosts.yml is where `gh auth login` keeps
#  # the token. (`env: {GH_TOKEN: ${env:GH_TOKEN}}` works too, and keeps it off
#  # the container's disk.)
#  - src: ~/.config/gh/hosts.yml
#    dst: ${HOME}/.config/gh/hosts.yml
#  - src: ~/.config/mytool/
#    dst: ${HOME}/.config/mytool

# Scripts run before the session starts, after everything cld installs — so a
# tool one installs is there from claude's first prompt. "setup" runs once per
# container (again when you edit it), "start" on every container start. A
# failure is logged and provisioning continues unless you set on_error: fail.
#scripts:
#  setup: sudo apt-get update && sudo apt-get install -y ripgrep
#  start: echo "started ${CLD_NAME}"

# A Docker engine for sessions: a docker-in-docker container on a private
# network, with DOCKER_HOST pointed at it. ON by default, and shared by every
# project — one BuildKit cache every build warms, one daemon's memory.
#
# Read docs/session-docker.md before leaving it on: an engine is root on that
# engine for claude and anything claude runs, the engine container is privileged
# and shares the host kernel, and projects sharing one are not isolated from each
# other's containers. Turn it off here or per project with `mode: off`.
#
# To add a volume (or dockerd flags, capabilities, limits) to the engine, put a
# compose-shaped cld.dind.yaml next to this file — docs/session-docker.md has a
# worked example:
#
#   services:
#     dind:
#       volumes:
#         - /srv/build-cache:/cache    # absolute host paths only
#
# `scope: project` gives a project an engine of its own; only such an engine can
# bind the workspace, which is what `docker run -v /workspace:/app` needs
# (builds work either way — the context is streamed by the client). image and
# compose shape the engine, so a project block may set them only together with
# `scope: project`; for the shared engine they are set here, for everyone.
#docker:
#  mode: dind          # dind (default) | off
#  scope: shared       # shared (default) | project
#  image: docker:dind  # pin it (docker:28-dind), or soften it (docker:dind-rootless)
#  # A compose-shaped override for the engine container, resolved against this
#  # file's directory. Defaults to cld.dind.yaml when that exists; naming one
#  # here makes it required. Only keys that map onto a container are supported —
#  # unknown ones are an error, not a silent no-op. `cld docker -- ps` drives the
#  # engine, which is deliberately not reachable from the host.
#  compose: cld.dind.yaml

# The same three, scoped to the workspaces a glob matches. "match" is matched
# against the host-side workspace path, exactly like "ignore" above. EVERY
# matching block applies, in file order, so a broad one and a narrow one
# compose. This is the place for a remote Docker engine and its credentials:
# only the projects that need it get them.
#projects:
#  - match: ~/work/acme/**
#    env:
#      AWS_PROFILE: acme
#      DOCKER_HOST: tcp://build01.internal:2376
#      DOCKER_TLS_VERIFY: "1"
#      DOCKER_CERT_PATH: ${HOME}/.docker-remote
#    files:
#      - src: ~/.docker/build01/
#        dst: ${HOME}/.docker-remote
#    scripts:
#      setup:
#        run: [make, dev-setup]
#        user: root
#        timeout: 10m
#        on_error: fail
#    docker:
#      scope: project  # an engine of its own, so `-v $(pwd)` works

auth:
  # By default each container logs in for itself: run `claude` inside it and
  # complete the login once. cld persists that login (.credentials.json) to the
  # project's isolated backup and restores it whenever the container is
  # recreated, so you log in only once per project — and, because the backup is
  # per-project, one container's rotating token never clobbers another's.
  #
  # To instead share ONE Claude subscription across sessions, run `cld auth
  # login` (the daemon owns and centrally refreshes the login) and opt the
  # projects that should use it in with `cld up --proxy` / `cld it --proxy`.
  # Those sessions authenticate through the daemon's proxy with only short-lived
  # access tokens (no refresh token ever enters a container). The proxy is
  # opt-in because it points ANTHROPIC_BASE_URL at a non-first-party endpoint,
  # which makes Claude Code degrade its UI and disable some features; switch a
  # project back with `--no-proxy`. Neither path is configured here.

  # Relay the host ssh-agent into each session (SSH_AUTH_SOCK), so `git commit`
  # can sign and SSH pushes work inside the container — like VS Code Dev
  # Containers. Enabled by default; set false to keep the agent off-limits to
  # container code.
  #forward_agent: true

  # Install cld's own user-default Claude Code config into each session:
  # <data_dir>/user-default/settings.json, CLAUDE.md, and the commands/,
  # agents/, and output-styles/ directories. This is a directory cld owns, not
  # your host's ~/.claude — cld never reads or writes that; populate
  # user-default by editing files there directly. settings.json is sanitized
  # first — secret/host-only keys are dropped so they never cross into the
  # container (env, the apiKeyHelper/aws*/otel auth helpers, the project-MCP
  # auto-trust flags); the rest carries over. Credentials, project history,
  # and runtime state are never propagated this way. Enabled by default; set
  # false to keep containers on cld's minimal seed only.
  #share_config: true

release:
  # Base URL of the Claude Code release channel.
  #base_url: https://downloads.claude.ai/claude-code-releases
  # Release channel to follow: "stable" or "latest".
  #channel: latest
  # How often to check the channel for a new version.
  #check_interval: 1h

gh:
  # Inject the GitHub CLI (`gh`) into a container whose workspace has a
  # GitHub remote. Enabled by default; set to true to turn it off.
  #disabled: false

dotfiles:
  # Personalize each container from your host's ~/.dotfiles, like VS Code Dev
  # Containers: cld copies ~/.dotfiles into the container and, if it has an
  # install.sh, runs it (as the container user, with the copied dir as the
  # working directory, honoring its shebang); otherwise it symlinks the tree's
  # top-level dotfiles into $HOME. Nothing is sanitized — whatever you put in
  # ~/.dotfiles is copied verbatim, so keep secrets out of it. The daemon reads
  # ~/.dotfiles through the read-only host-home mount `cld install` adds, and
  # does nothing when you have no ~/.dotfiles. Enabled by default; set to true
  # to turn it off.
  #disabled: false

telemetry:
  # Collect Claude Code's own OpenTelemetry consumption metrics from each
  # session — token counts and its cost estimate — and show them in `cld ls`.
  # The daemon IS the collector: it serves an OTLP receiver over the same
  # in-container relay as the control API, so nothing leaves your machine. The
  # totals are held in memory only; they reset when the daemon restarts or a
  # container is removed. Needs the relay, so it is unavailable on a container
  # whose architecture differs from the host. Enabled by default; set to true
  # to turn it off.
  #disabled: false

  # How often each session flushes its metrics to the daemon. Claude Code's own
  # default is 60s, too laggy for a listing. Note that the counters only advance
  # when an API request COMPLETES, so a shorter interval cannot make the numbers
  # move during a long generation — it only shortens the lag after a turn ends,
  # and below a second or two it is pure overhead.
  #export_interval: 5s

sync:
  # Delay after a change before conversation state is copied out.
  #debounce: 3s
  # Polling interval used when the in-container watcher cannot run
  # (container architecture differs from the host).
  #fallback_interval: 1m
